<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Teachable Agent · 可训练智能体</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teachable Agent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">


<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-title">
    <h1>Teachable Agent</h1>
    <button class="ghost-btn" id="projectBtn" title="管理项目（当前项目的数据 / 聊天 / API 配置都在这里）">📁 <span id="projectName">默认项目</span></button>
  </div>
  <p class="subtitle">用户界面 · 数据存储 · 服务接口 — 三层联动，项目数据持久化在浏览器本地</p>
  <div class="badges">
    <span class="badge">OpenAI 兼容</span>
    <span class="badge">IndexedDB</span>
    <span class="badge">单文件 · 无依赖</span>
  </div>
</header>

<main class="workspace">

  <!-- ===== Mobile Tab Bar (only shown ≤1100px) ===== -->
  <div class="mobile-tabs" id="mobileTabs">
    <button class="mobile-tab active" data-target="uiLayer" type="button">
      <span class="mobile-tab-icon">💬</span><span class="mobile-tab-label">界面</span>
    </button>
    <button class="mobile-tab" data-target="dataLayer" type="button">
      <span class="mobile-tab-icon">📚</span><span class="mobile-tab-label">数据</span>
    </button>
    <button class="mobile-tab" data-target="apiLayer" type="button">
      <span class="mobile-tab-icon">🔌</span><span class="mobile-tab-label">接口</span>
    </button>
  </div>

  <!-- ===== UI Layer ===== -->
  <section class="layer ui-layer active-mobile" id="uiLayer">
    <div class="layer-header">
      <span class="layer-icon">💬</span>
      <h2>用户界面</h2>
      <button class="ghost-btn" id="clearChatBtn">清空对话</button>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state">点击下方输入框开始对话…</div>
    </div>
    <form class="composer" id="composer">
      <textarea id="userInput" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button type="submit" class="primary-btn" id="sendBtn">发送</button>
    </form>
  </section>

  <!-- ===== Data Layer ===== -->
  <section class="layer data-layer" id="dataLayer">
    <div class="layer-header">
      <span class="layer-icon">📚</span>
      <h2>数据存储</h2>
      <span class="counter" id="dataCount">0</span>
      <div class="layer-actions">
        <button class="ghost-btn" id="exportDataBtn">导出 JSON</button>
        <button class="ghost-btn danger" id="clearDataBtn">清空</button>
      </div>
    </div>
    <div class="data-list" id="dataList">
      <div class="empty-state">还没有训练数据。开始聊天后会自动累积。<br>💡 数据层同时是 LLM 的对话上下文 —— 清空数据层后 LLM 会失去历史记忆。<br>🖐 拖拽卡片顶部手柄可调整顺序；input / output 面板可分别点 × 删除。<br>点击右上角「导出」可下载为 JSON。</div>
    </div>
  </section>

  <!-- ===== API Layer ===== -->
  <section class="layer api-layer" id="apiLayer">
    <div class="layer-header">
      <span class="layer-icon">🔌</span>
      <h2>服务接口</h2>
      <span class="api-waiting" id="apiWaiting" hidden>等待响应…</span>
    </div>
    <form class="api-form" id="apiForm">
      <label>
        <span>Provider</span>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="moonshot">Moonshot (月之暗面)</option>
          <option value="agnes">Agnes</option>
          <option value="ollama">Ollama (本地)</option>
          <option value="lmstudio">LM Studio (本地)</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <label>
        <span>Base URL</span>
        <input type="url" id="baseUrl" placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false">
      </label>
      <label>
        <span>Model</span>
        <input type="text" id="modelName" placeholder="gpt-4o-mini" autocomplete="off" spellcheck="false">
      </label>
      <label>
        <span>API Key</span>
        <div class="key-input">
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
          <button type="button" class="icon-btn" id="toggleKeyBtn" title="显示/隐藏">👁</button>
        </div>
      </label>
      <div class="api-actions">
        <button type="button" class="ghost-btn" id="testConnBtn">测试连接</button>
        <span class="api-hint">所有配置保存在浏览器 localStorage</span>
      </div>
    </form>
  </section>

  <!-- ===== Connections Overlay (SVG) ===== -->
  <svg class="connections-overlay" id="connectionsOverlay" preserveAspectRatio="none">
    <g id="conn1Group" class="conn-1">
      <path id="path1" class="conn-line" d=""/>
    </g>
    <g id="conn2Group" class="conn-2">
      <path id="path2" class="conn-line" d=""/>
    </g>
  </svg>

</main>






<!-- ============ 项目管理模态框（必须放在 

<script src="app.js"></script>
</body>
</html>
